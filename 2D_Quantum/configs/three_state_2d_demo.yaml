grid:
  xmin: -6.0
  xmax: 6.0
  nx: 96
  ymin: -4.0
  ymax: 4.0
  ny: 64
  mx: 2000.0
  my: 1800.0

initial_state:
  state_index: 0
  x0: -3.5
  y0: 0.0
  px0: 14.0
  py0: 0.0
  sigma_x: 0.45
  sigma_y: 0.45

simulation:
  tmax: 30.0
  seed: 12345
  run_poisson: true
  compute_exact: true
  exact_dt: 0.05

model:
  kind: external_2d_multistate
  path: ../examples/three_state_2d_demo.npz
  format: npz
  nstates: 3
  columns:
    x: x
    y: y
    diagonal: [V11, V22, V33]
    couplings:
      - [0, 1, V12]
      - [1, 2, V23]

algorithm:
  mu_target: 0.25
  dt_min: 0.02
  dt_max: 0.40
  scale: 6.0
  floor: 0.0
  clip_min: 1.0e-4
  clip_max: 5.0e-2
  gap_refine: true
  gap_threshold: 0.02
  eta_threshold: 0.25
  refine_factor: 0.5
  ntraj_hi: 64
  ess_threshold: 0.5
  resampling_enabled: false
  base_edges:
    - [0, 1]

channels:
  x_divider: 0.0
  radial_regions:
    - name: fc_region
      center: [-3.0, 0.0]
      r_min: 0.0
      r_max: 1.2
    - name: product_region
      center: [3.0, 0.0]
      r_min: 0.0
      r_max: 1.4

cap:
  enabled: true
  mode: separable_poly
  x:
    x_min_on: -5.0
    x_max_on: 5.0
    eta: 0.010
    power: 2
  y:
    y_min_on: -3.2
    y_max_on: 3.2
    eta: 0.010
    power: 2

analysis:
  variance_batches: 4
  paper_variance_replicas: 0
  paper_variance_ntraj_hi: 0

output:
  directory: ./outputs_three_state_2d_demo
  prefix: three_state_2d_demo
  export_preview_csv: true
  preview_mode: cuts
  preview_y_values: [0.0, 1.0]
  preview_x_values: [0.0]
