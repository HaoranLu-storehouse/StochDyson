# Cr(CO)5 2-mode / 3-state linear vibronic coupling model
# Latest 2D YAML for the current parallel Poisson code
# Notes:
#   - x := mode 2 (tuning / relaxation coordinate)
#   - y := mode 1 (branching / coupling coordinate)
#   - energies in the NPZ are Hartree
#   - time is in atomic units (1 fs = 41.3413745758 a.u.)
#   - CAP is explicitly disabled in this input
#   - The 2D NPZ grid must match the simulation grid exactly

grid:
  xmin: -30.0
  xmax: 30.0
  nx: 800
  ymin: -10.0
  ymax: 10.0
  ny: 200
  mx: 2109.4097865106974
  my: 2109.4097865106974

initial_state:
  # The published model initializes the second diabatic state.
  state_index: 1
  x0: 14.3514
  y0: 0.0
  px0: 0.0
  py0: 0.0
  sigma_x: 0.64856
  sigma_y: 0.63654

simulation:
  # 1000 fs = 41341.3745758 a.u.
  tmax: 41341.3745758
  seed: 12345
  run_poisson: true
  compute_exact: true
  exact_dt: 10.0

model:
  kind: external_2d_multistate
  path: ../crco5_lvcm_2d.npz
  format: npz
  nstates: 3
  columns:
    x: x
    y: y
    diagonal: [V11, V22, V33]
    couplings:
      - [0, 1, V12]
      - [0, 2, V13]
      - [1, 2, V23]

algorithm:
  mu_target: 0.05
  dt_min: 0.5
  dt_max: 4
  scale: 0.5
  floor: 0.02
  clip_min: 1.0e-2
  clip_max: 0.4
  gap_refine: false
  gap_threshold: 2.0e-3
  eta_threshold: 0.20
  refine_factor: 0.5
  ntraj_hi: 400
  ess_threshold: 0.75
  resampling_enabled: false
  base_edges: []


channels:
  x_divider: 0.0
  radial_regions:
    - name: fc_region
      center: [14.3514, 0.0]
      r_min: 0.0
      r_max: 2.5
    - name: jt_region
      center: [0.0, 0.0]
      r_min: 0.0
      r_max: 1.75
    - name: state1_valley
      center: [2.542635658914729, 0.0]
      r_min: 0.0
      r_max: 1.5
    - name: state2_valley
      center: [-2.542635658914729, 0.0]
      r_min: 0.0
      r_max: 1.5

cap:
  enabled: false

analysis:
  wavefunction_error_tracking: true
  variance_batches: 4
  paper_variance_replicas: 0
  paper_variance_ntraj_hi: 0

output:
  directory: ./outputs_crco5_analysis_0.5_5_full_short05_4_resamp_floor002_PP400
  prefix: crco5_lvcm
  export_preview_csv: true
  preview_mode: cuts
  preview_y_values: [0.0]
  preview_x_values: [14.3514, 2.542635658914729, 0.0, -2.542635658914729]
